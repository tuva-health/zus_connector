name: 'zus_connector'
version: '0.1.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# Required by The Tuva Project 1.0 so its refs resolve to its own models before
# same-named models in this project (e.g. condition, patient).
flags:
  require_ref_searches_node_package_before_root: true

vars:
  ## Zus source vars
  ### Set to true if your Zus FHIR Data Marts are on the v2 relational schema.
  ### Leave false (the default) for the v1 relational schema.
  v2_enabled: false

  ## The Tuva Project vars
  ### Uncomment the line(s) based on the type of source data.
  ### Feature vars must be native, unquoted YAML booleans.
  claims_enabled: false
  clinical_enabled: true
  #provider_attribution_enabled: true

  ## CMS HCC data mart vars
  # Setting the payment year to year needed for the demo data
  #cms_hcc_payment_year: 2018

  ## Quality Measure data mart vars
  ### Setting the reporting period to date needed for demo data
  #quality_measures_period_end: "2018-12-31"


model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["dbt_doc_blocks", "models"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  zus_connector:
    staging:
      +materialized: view
      +schema: _input_layer
      +tags: input_layer
    intermediate:
      +materialized: table
      +schema: _input_layer
      +tags: input_layer
    final:
      +materialized: table
      +schema: input_layer
      +tags: input_layer
